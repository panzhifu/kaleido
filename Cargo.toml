[workspace]
resolver = "3"
members = [
    "crates/kaleido-core",
    "crates/kaleido-traits",
    "crates/kaleido-services",
    "crates/kaleido-sdk",
    "crates/kaleido-plugin-host",
    "apps/cli",
    "apps/desktop",
    "plugins/examples/brightness",
    "plugins/examples/invert",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["Kaleido Team"]
license = "MIT"

[workspace.dependencies]
cordis-rs = "0.6"
thiserror = "2.0"
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
tracing = "0.1"
chrono = "0.4"
crossbeam-channel = "0.5"
image = "0.25"
wide = "0.7"
rayon = "1.10"

# GUI 框架（git 依赖；https 经全局 git insteadOf 重写为 ssh）
gpui = { git = "https://github.com/zed-industries/zed", package = "gpui" }
gpui_platform = { git = "https://github.com/zed-industries/zed", package = "gpui_platform", features = ["font-kit"] }
gpui-component = { git = "https://github.com/longbridge/gpui-component", package = "gpui-component" }
gpui-component-assets = { git = "https://github.com/longbridge/gpui-component", package = "gpui-component-assets" }
