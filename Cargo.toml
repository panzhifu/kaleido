[workspace]
resolver = "3"
members = [
    "crates/kaleido-core",
    "crates/kaleido-traits",
    "crates/kaleido-services",
    "crates/kaleido-sdk",
    "apps/cli",
    "apps/desktop",
    "plugins/examples/tga",
    "plugins/examples/move-tool",
    "plugins/examples/color-panel",
    "plugins/wasm/simple_format",
]

# The WASM plugin (simple_format) is a cdylib and cannot run as a test
# binary on the host.  `cargo test --workspace` skips it automatically
# because it has no host-runnable tests.

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["Kaleido Team"]
license = "MIT"

[workspace.dependencies]
cordis-rs = "0.6"
thiserror = "2.0"
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
tracing = "0.1"
chrono = "0.4"
crossbeam-channel = "0.5"
image = "0.25"
wide = "0.7"
rayon = "1.10"
rust-i18n = "4"
once_cell = "1.20"

# GUI 框架
# gpui-kit bundles gpui + gpui-base + gpui-component + gpui-kit-assets
gpui-kit = { path = "../gpui-kit/crates/kit" }
